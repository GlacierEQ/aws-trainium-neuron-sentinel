name: Public Truth Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact source identity
        shell: bash
        run: |
          expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.event.pull_request.base.sha }}"
            git merge-base --is-ancestor "${{ github.event.pull_request.base.sha }}" HEAD
          fi

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile Python surfaces
        run: python -m compileall -q src tests scripts

      - name: Run deterministic repository proof
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Compile C++ reference surfaces
        run: |
          g++ -std=c++17 -Wall -Wextra -pedantic -c src/neuron_allocator.cpp -o /tmp/neuron_allocator.o
          g++ -std=c++17 -Wall -Wextra -pedantic -c src/neuron_executor.cpp -o /tmp/neuron_executor.o

      - name: Verify public and machine truth boundary
        run: python scripts/verify_public_truth.py
